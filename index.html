<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Trombone iOS Audio Test</title>
<!--
  PHASE 0 TEST HARNESS (zakaton port).
  Purpose: verify the modern AudioWorklet Pink Trombone makes SOUND on the
  target iPhone before doing any integration work.

  SETUP (offline, no build step):
   1. From github.com/zakaton/Pink-Trombone, download these two pre-built files:
        pink-trombone.min.js
        pink-trombone-worklet-processor.min.js
   2. Put BOTH of them in the SAME folder as this test file (e.g. /pt-test/).
      The first imports the second as a sibling; they must sit together.
   3. Commit to your repo and open this page's URL on the iPhone
      (test iOS Safari AND iOS Chrome), silent switch OFF, volume up.
   4. Tap "Start Sound". If you hear a tone, the modern engine works on iOS
      and integration is worth doing. If silent, note the on-screen state/error.

  This page prints state and errors ON SCREEN because iOS has no easy console.
-->
<style>
  body{background:#0f0e17;color:#f5f0e8;font-family:Georgia,serif;margin:0;padding:24px;line-height:1.5}
  h1{font-size:20px;font-weight:normal}
  button{background:rgba(201,168,76,0.15);border:1px solid #c9a84c;color:#c9a84c;
    border-radius:6px;padding:16px 28px;font-family:Georgia,serif;font-size:18px;
    cursor:pointer;margin:8px 0;display:block;width:100%;max-width:360px}
  button.stop{background:rgba(196,96,122,0.15);border-color:#c4607a;color:#c4607a}
  #log{margin-top:20px;font-family:monospace;font-size:13px;white-space:pre-wrap;
    background:#1a1828;border:1px solid #2e2b4a;border-radius:6px;padding:12px}
  .row{margin:6px 0}
  label{font-size:13px;color:#9a9488;display:block;margin:14px 0 4px}
  input[type=range]{width:100%;max-width:360px}
  pink-trombone{display:block;max-width:360px;margin:16px 0;border:1px solid #2e2b4a;border-radius:6px}
</style>
</head>
<body>
<h1>Pink Trombone — iOS Audio Test</h1>
<p style="font-size:13px;color:#9a9488;max-width:520px">
  Silent switch OFF, volume up. Tap Start Sound. You should hear a steady vowel
  tone and be able to drag on the tract. Report what the log shows.
</p>

<pink-trombone></pink-trombone>

<button id="startBtn">▶ Start Sound</button>
<button id="stopBtn" class="stop" style="display:none">■ Stop</button>

<label>Pitch (Hz): <span id="freqLabel">140</span></label>
<input type="range" id="freq" min="80" max="300" value="140">

<label>Tenseness: <span id="tenseLabel">0.6</span></label>
<input type="range" id="tense" min="0" max="1" step="0.01" value="0.6">

<div id="log">Waiting. Tap "Start Sound" to begin.</div>

<!-- Load the port's pre-built module. Must be a sibling of this file. -->
<script src="pink-trombone.min.js" type="module"></script>

<script>
const log=(m)=>{const el=document.getElementById('log');
  el.textContent=(new Date().toLocaleTimeString())+'  '+m+'\n'+el.textContent;};
window.addEventListener('error',e=>log('window error: '+e.message));
window.addEventListener('unhandledrejection',e=>log('promise rejection: '+(e.reason&&e.reason.message||e.reason)));

const pt=document.querySelector('pink-trombone');
let ctx=null, started=false;

if(!pt){
  log('ERROR: <pink-trombone> element not found — did pink-trombone.min.js load? '+
      'Check that the file is present and served with a JS MIME type.');
}

// The element fires 'load' once its worklet module is ready.
pt&&pt.addEventListener('load',()=>log('pink-trombone element loaded (worklet ready).'));

document.getElementById('startBtn').addEventListener('click',async()=>{
  try{
    log('Start tapped.');
    if(!ctx){
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      log('AudioContext created. state='+ctx.state);
    }
    if(ctx.state==='suspended'){ await ctx.resume(); log('resume() -> state='+ctx.state); }
    // Hand our (gesture-resumed) context to the element, then connect + start.
    await pt.setAudioContext(ctx);
    log('setAudioContext resolved. state='+ctx.state);
    pt.connect(ctx.destination);
    pt.start();
    started=true;
    // Apply current slider values
    setFreq(document.getElementById('freq').value);
    setTense(document.getElementById('tense').value);
    document.getElementById('startBtn').style.display='none';
    document.getElementById('stopBtn').style.display='block';
    log('Started. If you hear nothing: silent switch? volume? state='+ctx.state);
  }catch(err){
    log('EXCEPTION: '+(err&&err.message||err));
  }
});

document.getElementById('stopBtn').addEventListener('click',()=>{
  try{ pt.stop(); }catch(e){ log('stop error: '+e.message); }
  document.getElementById('stopBtn').style.display='none';
  document.getElementById('startBtn').style.display='block';
  log('Stopped.');
});

function setFreq(v){
  document.getElementById('freqLabel').textContent=v;
  try{ if(started&&pt.frequency) pt.frequency.value=parseFloat(v); }catch(e){}
}
function setTense(v){
  document.getElementById('tenseLabel').textContent=v;
  try{ if(started&&pt.tenseness) pt.tenseness.value=parseFloat(v); }catch(e){}
}
document.getElementById('freq').addEventListener('input',e=>setFreq(e.target.value));
document.getElementById('tense').addEventListener('input',e=>setTense(e.target.value));
</script>
</body>
</html>
